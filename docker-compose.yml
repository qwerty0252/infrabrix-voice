services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - data:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
  frontend:
    build:
      context: ./frontend
      args:
        INFRABRIX_API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
volumes:
  data:
